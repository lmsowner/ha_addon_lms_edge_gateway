name: Publish Edge Gateway images

on:
  push:
    branches: [main]
    paths:
      - "lms_edge_gateway/**"
      - ".github/workflows/publish-edge-gateway.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/lmsowner/lms_edge_gateway

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base:latest
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read add-on version
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' lms_edge_gateway/config.yaml | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not read version from lms_edge_gateway/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Edge Gateway $version for ${{ matrix.arch }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: lms_edge_gateway
          file: lms_edge_gateway/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
            DOTNET_CONFIGURATION=Release
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=lms-edge-gateway-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lms-edge-gateway-${{ matrix.arch }}

  package-visibility:
    name: Ensure GHCR packages are public
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Make architecture packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for arch in amd64 aarch64; do
            package="lms_edge_gateway-${arch}"
            echo "Setting visibility for ghcr.io/lmsowner/${package}"
            curl -fsS -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${package}/visibility" \
              -d '{"visibility":"public"}' \
              || curl -fsS -X PUT \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/orgs/lmsowner/packages/container/${package}/visibility" \
                -d '{"visibility":"public"}' \
              || echo "Could not auto-set ${package} public; set it manually in GitHub Packages if pulls fail."
          done
