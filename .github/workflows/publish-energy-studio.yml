name: Publish Energy Studio images

on:
  push:
    branches: [main]
    paths:
      - "lms_energy_studio/**"
      - ".github/workflows/publish-energy-studio.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/lmsowner/lms_energy_studio

jobs:
  publish:
    name: Publish ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base:latest
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          version="$(sed -n 's/^version:[[:space:]]*"\([^"]*\)".*/\1/p' lms_energy_studio/config.yaml | head -n1)"
          if [ -z "$version" ]; then
            echo "Could not read version from lms_energy_studio/config.yaml" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing Energy Studio $version for ${{ matrix.arch }}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: lms_energy_studio
          file: lms_energy_studio/Dockerfile
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          provenance: false
          sbom: false
          build-args: |
            BUILD_FROM=${{ matrix.build_from }}
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=${{ steps.version.outputs.version }}
            DOTNET_CONFIGURATION=Release
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.arch }}:latest
          cache-from: type=gha,scope=lms-energy-studio-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=lms-energy-studio-${{ matrix.arch }}

      - name: Smoke test image before publishing
        env:
          TEST_IMAGE: ${{ env.IMAGE_PREFIX }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          docker run -d --name energy-smoke -p 5066:5066 "$TEST_IMAGE"
          trap 'docker logs energy-smoke; docker rm -f energy-smoke' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:5066/healthz; then
              test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5066/api/energy/config)" = 401
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Push tested architecture images
        run: |
          docker push ${{ env.IMAGE_PREFIX }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
          docker push ${{ env.IMAGE_PREFIX }}-${{ matrix.arch }}:latest

  package-visibility:
    name: Ensure GHCR packages are public
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Make architecture packages public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for arch in amd64 aarch64; do
            package="lms_energy_studio-${arch}"
            echo "Setting visibility for ghcr.io/lmsowner/${package}"
            curl -fsS -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${package}/visibility" \
              -d '{"visibility":"public"}' \
              || curl -fsS -X PUT \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/orgs/lmsowner/packages/container/${package}/visibility" \
                -d '{"visibility":"public"}' \
              || echo "Could not auto-set ${package} public; set it manually in GitHub Packages if pulls fail."
          done
