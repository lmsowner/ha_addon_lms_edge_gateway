name: LMS Edge Gateway for Home Assistant
version: "0.1.51"
slug: lms_edge_gateway
description: "LMS Edge Gateway for Home Assistant: secure application publishing for Home Assistant and self-hosted services."
url: https://github.com/lmsowner/ha_addon_lms_edge_gateway
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 5000
ingress_stream: true
host_network: true
panel_icon: mdi:cloud-lock
panel_title: Edge Gateway
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
  - type: ssl
hassio_api: true
homeassistant_api: true
panel_admin: true
privileged:
  - NET_RAW
watchdog: http://[HOST]:[PORT:5000]/healthz
options:
  advanced_docker_discovery: false
  expanded_lan_discovery: false
  discovery_cidrs: ""
  discovery_ports: ""
schema:
  advanced_docker_discovery: bool
  expanded_lan_discovery: bool
  discovery_cidrs: str
  discovery_ports: str
