name: Linux Made Sane - Edge Gateway
version: "0.1.0"
slug: lms_edge_gateway
description: Secure application publishing and edge gateway for Home Assistant and self-hosted services.
url: https://github.com/lmsowner/ha_addon_lms_edge_gateway
arch:
  - amd64
  - aarch64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 5000
ingress_stream: true
panel_icon: mdi:cloud-lock
panel_title: Linux Made Sane - Edge Gateway
map:
  - type: addon_config
    read_only: false
  - type: ssl
hassio_api: true
homeassistant_api: true
panel_admin: true
watchdog: http://[HOST]:[PORT:5000]/healthz
options:
  advanced_docker_discovery: false
  expanded_lan_discovery: false
  discovery_cidrs: ""
  discovery_ports: ""
schema:
  advanced_docker_discovery: bool
  expanded_lan_discovery: bool
  discovery_cidrs: str
  discovery_ports: str
