services:
  lms-edge-gateway:
    build:
      context: ./lms_edge_gateway
      args:
        BUILD_FROM: ghcr.io/home-assistant/amd64-base:latest
        BUILD_ARCH: amd64
        BUILD_VERSION: 2026.08.17.21.36
    ports:
      - "5000:5000"
      - "18080:18080"
    volumes:
      - ./local-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  lms-tesla-fleet-helper:
    build:
      context: ./lms_tesla_fleet_helper
      args:
        BUILD_FROM: ghcr.io/home-assistant/amd64-base:latest
        BUILD_ARCH: amd64
        BUILD_VERSION: 0.1.0
    ports:
      - "5055:5055"
    volumes:
      - ./local-tesla-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Production
  lms-energy-studio:
    build:
      context: ./lms_energy_studio
      args:
        BUILD_ARCH: amd64
        BUILD_VERSION: 2026.10.02.17.34
    ports:
      - "127.0.0.1:5066:5066"
    volumes:
      - ./local-energy-data:/data
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      EnergyStudio__HomeAssistantUrl: ${ENERGY_STUDIO_HA_URL:-http://host.docker.internal:8123}
      EnergyStudio__HomeAssistantToken: ${ENERGY_STUDIO_HA_TOKEN:-}
      EnergyStudio__AccessToken: ${ENERGY_STUDIO_ACCESS_TOKEN:-}
