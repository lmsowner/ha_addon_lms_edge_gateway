configuration:
  edge_gateway_url:
    name: Edge Gateway API URL
    description: LMS Edge Gateway control-plane URL used by this helper to publish the Tesla public key and OAuth route. Keep the default when both add-ons run on the same Home Assistant host.
  public_upstream_url:
    name: Helper upstream URL
    description: URL that LMS Edge Gateway uses to reach this helper for Tesla OAuth start and callback forwarding. Keep the default when both add-ons run on the same Home Assistant host.
