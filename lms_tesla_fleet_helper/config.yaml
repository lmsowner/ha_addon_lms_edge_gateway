name: LMS Tesla Fleet Helper
version: "0.2.41"
slug: lms_tesla_fleet_helper
description: "Tesla Fleet key helper for Home Assistant using LMS Edge Gateway for public HTTPS publishing."
url: https://github.com/lmsowner/ha_addon_lms_edge_gateway
arch:
  - amd64
  - aarch64
startup: services
boot: manual
init: false
ingress: true
ingress_port: 5055
ingress_stream: true
host_network: true
hassio_api: true
hassio_role: default
panel_icon: mdi:car-electric
panel_title: Tesla Fleet
map:
  - type: addon_config
    read_only: false
  - type: share
    read_only: false
panel_admin: true
watchdog: http://[HOST]:[PORT:5055]/healthz
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_discovery_prefix: "homeassistant"
  mqtt_base_topic: "lms/tesla-fleet"
  homeassistant_mqtt_enabled: false
  fetch_realtime_vehicle_data: false
  homeassistant_refresh_interval_minutes: 15
  homeassistant_energy_refresh_interval_seconds: 10
  homeassistant_vehicle_refresh_interval_minutes: 15
schema:
  mqtt_host: str
  mqtt_port: int
  mqtt_username: str
  mqtt_password: password
  mqtt_discovery_prefix: str
  mqtt_base_topic: str
  homeassistant_mqtt_enabled: bool
  fetch_realtime_vehicle_data: bool
  homeassistant_refresh_interval_minutes: int
  homeassistant_energy_refresh_interval_seconds: int
  homeassistant_vehicle_refresh_interval_minutes: int
